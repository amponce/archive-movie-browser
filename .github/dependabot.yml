version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Packages that only work when upgraded together; a bump of one alone fails `npm ci`
      react:
        patterns: ["react", "react-dom"]
      vite:
        patterns: ["vite", "@vitejs/*"]
      # One PR for every other routine bump; majors come separately so they can be read properly
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Tailwind 4 is a migration (its PostCSS plugin moved to @tailwindcss/postcss and the
      # config format changed), not a version bump. Remove this once someone does that work.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /mcp
    schedule:
      interval: monthly
    groups:
      # The MCP SDK's server and client packages are released together
      mcp:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
